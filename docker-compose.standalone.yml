version: "3.9"

# Self-contained stack — bundles its own Postgres, Redis and MinIO so the app
# runs with ONE command and no external setup:
#
#   docker compose -f docker-compose.standalone.yml up
#
# All infra (Postgres/Redis/MinIO) is internal-only (not published to the
# host), so multiple DClaw apps can run at once without colliding. App at
# http://localhost:3069 (frontend) / http://localhost:8156 (backend).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: dclaw
      POSTGRES_DB: dclaw_marketing
    volumes:
      - marketing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclaw -d dclaw_marketing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dclaw-marketing &&
      mc anonymous set download local/dclaw-marketing &&
      exit 0
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: dclaw-marketing
      S3_USE_SSL: "false"
      APP_ENV: production
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
      OPENAI_COMPAT_BASE_URL: "http://host.docker.internal:11434"
      OPENAI_COMPAT_API_KEY: ""
      OPENAI_COMPAT_MODEL: "llama3.2:3b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8156:8156"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8156/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8156
        BACKEND_INTERNAL_URL: http://backend:8156
    environment:
      PORT: 3069
    ports:
      - "3069:3069"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3069/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  marketing_pgdata:
  redis_data:
  minio_data:
