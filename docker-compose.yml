version: "3.9"

# Postgres is NOT defined here — all DClaw apps share the one local Postgres in
# ../dclaw-local-db (started by ../dclaw-up.sh), using database dclaw_marketing.
# Redis + MinIO remain app-local (only Marketing uses them). Services that need
# the shared DB (backend, celery-worker, celery-beat) join the external
# "dclaw-net" network to reach it at host "dclaw-postgres".
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    # One-shot: create the dclaw-marketing bucket on first start.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dclaw-marketing &&
      mc anonymous set download local/dclaw-marketing &&
      exit 0
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@dclaw-postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: dclaw-marketing
      S3_USE_SSL: "false"
      APP_ENV: production
      # Dev-only Fernet key for encrypting per-tenant API credentials
      # (model provider keys, OAuth tokens). MUST be replaced in prod
      # with a freshly generated key — `python -c "from cryptography.
      # fernet import Fernet; print(Fernet.generate_key().decode())"`.
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
      # OpenAI-compatible escape hatch for the Conductor (#369).
      # Defaults below point at host-machine Ollama; clear them to fall
      # back to Anthropic, or set to Groq / OpenRouter / Gemini-compat /
      # vLLM / LM Studio / etc.
      OPENAI_COMPAT_BASE_URL: "http://host.docker.internal:11434"
      OPENAI_COMPAT_API_KEY: ""
      OPENAI_COMPAT_MODEL: "llama3.2:3b"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8156:8156"
    networks:
      - default
      - dclaw-net
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8156/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@dclaw-postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
    networks:
      - default
      - dclaw-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@dclaw-postgres:5432/dclaw_marketing
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      TENANT_ENCRYPTION_MASTER_KEY: "bqUs7dvwPNfolchbYftyzRJNp60aCVZvkK96G4WwHbs="
    networks:
      - default
      - dclaw-net
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 127.0.0.1 (not localhost) so the browser uses IPv4 directly.
        # Colima forwards ports via an SSH tunnel that listens on IPv4 only,
        # and Chromium-based fetch() on macOS may resolve `localhost` to ::1
        # first and fail with "Failed to fetch" without falling back to v4.
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8156
        # Server-side proxy target (Next.js rewrites). Baked at build
        # time because rewrites() is evaluated when the bundle is
        # produced, not at server boot. Inside the docker network, the
        # backend resolves via the service name.
        BACKEND_INTERNAL_URL: http://backend:8156
    environment:
      PORT: 3069
    ports:
      - "3069:3069"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3069/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  minio_data:

networks:
  dclaw-net:
    external: true
