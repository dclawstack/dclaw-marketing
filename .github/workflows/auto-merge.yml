# Poll-and-merge: workaround for `allow_auto_merge` being disabled at
# the org policy level. Instead of using GitHub's native auto-merge
# (`gh pr merge --auto`, which the org blocks), we list open PRs with
# the `auto-merge` label, check whether each one is ready (CI green +
# no conflicts + no unresolved review requests), and merge them
# directly with `gh pr merge --squash`.
#
# Triggers:
#   - PR labeled auto-merge / reopened / synchronize / ready_for_review
#   - pull_request_review submitted (in case an approval unblocks a PR)
#   - workflow_run completion of `Claude Code Review` — the only
#     non-instant check we still have. Firing on its completion gives
#     us near-zero-latency merges instead of waiting for cron.
#   - schedule every minute as a fallback (so a missed event
#     doesn't strand a PR indefinitely). 1 minute is the GHA cron
#     floor; sub-minute polling isn't supported by GitHub Actions.
#
# CI moved out-of-band: tests run locally before push. GitHub does
# no heavy validation work.
#
# GITHUB_TOKEN with contents: write + pull-requests: write is enough
# to merge PRs in this same repo. No PAT, no org-level auto-merge
# feature required.
name: Poll and merge labeled PRs

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Claude Code Review"]
    types: [completed]
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write
  pull-requests: write
  # issues: write is required so GitHub can auto-close linked issues
  # when the squash commit body contains `Closes #N`. Without this,
  # the merge succeeds but the issue stays OPEN.
  issues: write
  actions: read

concurrency:
  # Serialize so two events don't race to merge the same PR.
  group: poll-and-merge
  cancel-in-progress: false

jobs:
  poll-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find and merge ready PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Pull every open PR with the auto-merge label
          PRS=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --label auto-merge \
            --json number,title,mergeable,mergeStateStatus,isDraft,reviewDecision,statusCheckRollup \
            --limit 50)

          COUNT=$(echo "$PRS" | jq 'length')
          echo "Found $COUNT candidate PR(s) with label 'auto-merge'."
          if [ "$COUNT" = "0" ]; then
            exit 0
          fi

          # For each candidate, decide whether it is mergeable
          MERGED=0
          for ROW in $(echo "$PRS" | jq -r '.[] | @base64'); do
            _row() { echo "$ROW" | base64 --decode; }
            PR=$(_row)
            NUM=$(echo "$PR" | jq -r .number)
            TITLE=$(echo "$PR" | jq -r .title)
            DRAFT=$(echo "$PR" | jq -r .isDraft)
            MERGEABLE=$(echo "$PR" | jq -r .mergeable)
            MERGE_STATE=$(echo "$PR" | jq -r .mergeStateStatus)
            REVIEW=$(echo "$PR" | jq -r .reviewDecision)

            echo "PR #$NUM \"$TITLE\""
            echo "  draft=$DRAFT mergeable=$MERGEABLE state=$MERGE_STATE review=$REVIEW"

            if [ "$DRAFT" = "true" ]; then
              echo "  skip: draft"
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "  skip: not mergeable (conflicts or pending mergeability calc)"
              continue
            fi
            # Allowed merge-state buckets: CLEAN (all green) or UNSTABLE
            # (non-required check failing — we still merge). Reject
            # BLOCKED (required check failing) and DIRTY (conflicts).
            case "$MERGE_STATE" in
              CLEAN|UNSTABLE|HAS_HOOKS) : ;;
              BEHIND)
                echo "  skip: behind base — needs rebase"
                continue ;;
              BLOCKED|DIRTY|DRAFT|UNKNOWN)
                echo "  skip: state $MERGE_STATE"
                continue ;;
              *)
                echo "  skip: unhandled state $MERGE_STATE"
                continue ;;
            esac

            # If a review was explicitly requested, require approval
            if [ "$REVIEW" = "CHANGES_REQUESTED" ] || [ "$REVIEW" = "REVIEW_REQUIRED" ]; then
              echo "  skip: review decision = $REVIEW"
              continue
            fi

            # Check that no required check is failing or pending.
            #
            # We deliberately filter the workflow's OWN check out of
            # the rollup: when this workflow is triggered by a
            # `pull_request` event, GitHub registers it as a
            # `poll-and-merge` CheckRun on the PR. The workflow then
            # queries the rollup, sees its own in-flight check as
            # not-yet-green, and skips with "not all checks green" —
            # blocking itself.
            ALL_CHECKS_OK=$(echo "$PR" | jq -r '
              [.statusCheckRollup[]
                | select(.__typename == "CheckRun" or .__typename == "StatusContext")
                | select(.name != "poll-and-merge")
                | select(.workflowName != "Poll and merge labeled PRs")
              ]
              | map(
                  (.conclusion // .state // "UNKNOWN") as $c
                  | if ($c | ascii_upcase) == "SUCCESS"
                       or ($c | ascii_upcase) == "NEUTRAL"
                       or ($c | ascii_upcase) == "SKIPPED"
                    then true else false end
                )
              | all
            ')
            if [ "$ALL_CHECKS_OK" != "true" ]; then
              echo "  skip: not all checks green"
              continue
            fi

            echo "  → merging (squash)"
            # Pull the PR body into a temp file and pass via --body-file so
            # closing-keywords (Closes #N / Fixes #N) land in the squash
            # commit message. Without this, GitHub's auto-close on merge
            # never fires because the squash defaults exclude the PR body.
            BODY_FILE="$(mktemp)"
            gh pr view "$NUM" --repo "$REPO" --json body --jq '.body // ""' > "$BODY_FILE"
            if gh pr merge "$NUM" --repo "$REPO" --squash --body-file "$BODY_FILE" --delete-branch --auto=false 2>&1; then
              MERGED=$((MERGED+1))
              echo "  merged ✓"
            else
              echo "  merge failed (will retry on next event)"
            fi
          done

          echo "Total merged this run: $MERGED"
