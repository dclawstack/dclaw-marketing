<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--dk-bg);font-family:var(--dk-font-sans)}
.brand{display:flex;align-items:center;gap:14px}
.logo-mark{width:64px;height:64px;display:grid;place-items:center;background:var(--dk-purple-50);border:1px solid var(--dk-purple-200);border-radius:var(--dk-radius-md)}
.wordmark{flex:1}
.wordmark img{display:block;height:38px}
.lbl{font-size:11px;font-family:var(--dk-font-mono);color:var(--dk-fg-2);margin-top:6px}
</style></head>
<body class="dk-reset">
  <div class="brand">
    <div class="logo-mark"><img src="../assets/dkube-icon-purple.svg" alt="DKube cube" style="width:48px;height:48px;object-fit:contain"></div>
    <div class="wordmark">
      <img src="../assets/dkube-logo-purple.svg" alt="DKube">
      <div class="lbl">Brand-supplied wordmark · #7660A8 + #9384BD + #D6D6D6 · Poppins</div>
    </div>
  </div>
</body></html>
