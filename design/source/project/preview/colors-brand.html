<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--dk-bg);font-family:var(--dk-font-sans)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
  .swatch{flex:1;min-width:90px;border-radius:var(--dk-radius-sm);overflow:hidden;border:1px solid var(--dk-border);background:var(--dk-bg)}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-size:12px;font-weight:600;color:var(--dk-fg);line-height:1.2}
  .hex{font-size:11px;color:var(--dk-fg-2);font-family:var(--dk-font-mono);margin-top:2px}
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-900)"></div><div class="meta"><div class="name">purple-900</div><div class="hex">#4A3878</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-800)"></div><div class="meta"><div class="name">purple-800</div><div class="hex">#5C4A8E</div></div></div>
    <div class="swatch" style="outline:2px solid var(--dk-brand);outline-offset:-2px"><div class="chip" style="background:var(--dk-purple-700)"></div><div class="meta"><div class="name">purple-700 · brand</div><div class="hex">#7660A8</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-500)"></div><div class="meta"><div class="name">purple-500</div><div class="hex">#9384BD</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-300)"></div><div class="meta"><div class="name">purple-300</div><div class="hex">#C9C0DE</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-100)"></div><div class="meta"><div class="name">purple-100</div><div class="hex">#F1EEF8</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-purple-50);border-bottom:1px solid var(--dk-border)"></div><div class="meta"><div class="name">purple-50 · wash</div><div class="hex">#F8F6FB</div></div></div>
  </div>
</body></html>
