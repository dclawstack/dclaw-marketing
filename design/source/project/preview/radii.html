<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--dk-bg);font-family:var(--dk-font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:80px}.box{width:64px;height:64px;background:var(--dk-purple-100);border:1.5px solid var(--dk-brand)}.lbl{font-size:11px;font-family:var(--dk-font-mono);color:var(--dk-fg-2);text-align:center}</style></head>
<body class="dk-reset">
  <div class="row">
    <div class="cell"><div class="box" style="border-radius:4px"></div><div class="lbl">xs · 4</div></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><div class="lbl">sm · 8</div></div>
    <div class="cell"><div class="box" style="border-radius:12px"></div><div class="lbl">md · 12</div></div>
    <div class="cell"><div class="box" style="border-radius:16px"></div><div class="lbl">lg · 16<br>cards</div></div>
    <div class="cell"><div class="box" style="border-radius:24px"></div><div class="lbl">xl · 24</div></div>
    <div class="cell"><div class="box" style="border-radius:32px"></div><div class="lbl">2xl · 32</div></div>
    <div class="cell"><div class="box" style="border-radius:999px"></div><div class="lbl">pill<br>buttons</div></div>
  </div>
</body></html>
