<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--dk-bg)}.row{display:flex;align-items:end;gap:10px}.cell{display:flex;flex-direction:column;align-items:center;gap:6px}.box{background:var(--dk-purple-200);border:1px solid var(--dk-purple-400);border-radius:4px}.lbl{font-size:10px;font-family:var(--dk-font-mono);color:var(--dk-fg-2)}</style></head>
<body class="dk-reset">
  <div class="row">
    <div class="cell"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1·4</div></div>
    <div class="cell"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2·8</div></div>
    <div class="cell"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3·12</div></div>
    <div class="cell"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4·16</div></div>
    <div class="cell"><div class="box" style="width:24px;height:24px"></div><div class="lbl">6·24</div></div>
    <div class="cell"><div class="box" style="width:32px;height:32px"></div><div class="lbl">8·32</div></div>
    <div class="cell"><div class="box" style="width:48px;height:48px"></div><div class="lbl">12·48</div></div>
    <div class="cell"><div class="box" style="width:64px;height:64px"></div><div class="lbl">16·64</div></div>
    <div class="cell"><div class="box" style="width:80px;height:80px"></div><div class="lbl">20·80</div></div>
  </div>
</body></html>
