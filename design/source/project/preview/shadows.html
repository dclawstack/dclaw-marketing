<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px 20px;background:var(--dk-bg);font-family:var(--dk-font-sans)}.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}.cell{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:90px}.box{width:80px;height:60px;background:var(--dk-white);border-radius:var(--dk-radius-md);border:1px solid var(--dk-border)}.lbl{font-size:11px;font-family:var(--dk-font-mono);color:var(--dk-fg-2);text-align:center}</style></head>
<body class="dk-reset">
  <div class="row">
    <div class="cell"><div class="box" style="box-shadow:var(--dk-shadow-xs)"></div><div class="lbl">xs</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--dk-shadow-sm)"></div><div class="lbl">sm</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--dk-shadow-md)"></div><div class="lbl">md · cards</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--dk-shadow-lg)"></div><div class="lbl">lg</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--dk-shadow-brand);background:var(--dk-brand);border-color:transparent"></div><div class="lbl">brand · cta</div></div>
  </div>
</body></html>
