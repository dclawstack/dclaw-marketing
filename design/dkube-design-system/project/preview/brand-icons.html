<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--dk-bg);font-family:var(--dk-font-sans)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.icon{width:48px;height:48px;display:grid;place-items:center;background:var(--dk-purple-50);border-radius:var(--dk-radius-md)}
.icon img{width:28px;height:28px;object-fit:contain}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.lbl{font-size:10px;font-family:var(--dk-font-mono);color:var(--dk-fg-2)}
</style></head>
<body class="dk-reset">
  <div class="row">
    <div class="cell"><div class="icon"><img src="../assets/icon-magic.svg"></div><div class="lbl">private-ai</div></div>
    <div class="cell"><div class="icon"><img src="../assets/icon-trust.svg"></div><div class="lbl">trust</div></div>
    <div class="cell"><div class="icon"><img src="../assets/icon-scalable.svg"></div><div class="lbl">scalable</div></div>
    <div class="cell"><div class="icon"><img src="../assets/arrow-icon.svg"></div><div class="lbl">arrow-r</div></div>
    <div class="cell"><div class="icon"><img src="../assets/arrow-top-right.png"></div><div class="lbl">cta-↗</div></div>
    <div class="cell"><div class="icon"><img src="../assets/round-arrow-right.svg"></div><div class="lbl">round-→</div></div>
    <div class="cell"><div class="icon"><img src="../assets/si-linkedin.svg"></div><div class="lbl">linkedin</div></div>
    <div class="cell"><div class="icon"><img src="../assets/si-twitter.svg"></div><div class="lbl">twitter</div></div>
    <div class="cell"><div class="icon"><img src="../assets/si-insta.svg"></div><div class="lbl">instagram</div></div>
  </div>
</body></html>
