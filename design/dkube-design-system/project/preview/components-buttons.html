<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--dk-bg);font-family:var(--dk-font-sans)}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:var(--dk-radius-pill);font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;transition:all 200ms var(--dk-ease-out)}
.btn-primary{background:var(--dk-brand);color:#fff}
.btn-primary:hover{background:var(--dk-brand-hover);box-shadow:var(--dk-shadow-brand)}
.btn-secondary{background:var(--dk-white);color:var(--dk-fg);border-color:var(--dk-border-strong)}
.btn-secondary:hover{border-color:var(--dk-brand);color:var(--dk-brand)}
.btn-ghost{background:transparent;color:var(--dk-fg);padding:14px 8px;border-radius:0}
.btn-ghost:hover{color:var(--dk-brand)}
.arrow{width:14px;height:14px;display:inline-block}
</style></head>
<body class="dk-reset">
  <div class="row">
    <button class="btn btn-primary">Talk to Us <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
    <button class="btn btn-secondary">Read White Paper <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
    <button class="btn btn-ghost">Explore <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</body></html>
