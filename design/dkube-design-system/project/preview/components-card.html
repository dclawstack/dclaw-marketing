<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--dk-bg-muted);font-family:var(--dk-font-sans)}
.card{background:var(--dk-white);border:1px solid var(--dk-border);border-radius:var(--dk-radius-lg);box-shadow:var(--dk-shadow-sm);overflow:hidden;max-width:340px;transition:all 240ms var(--dk-ease-out)}
.thumb{height:120px;background:linear-gradient(135deg,#9384BD,#7660A8);position:relative}
.body{padding:16px 18px 18px}
.tags{display:flex;gap:6px;margin-bottom:10px}
.tag{font-size:11px;font-weight:600;color:var(--dk-brand);background:var(--dk-purple-100);padding:3px 10px;border-radius:var(--dk-radius-pill)}
.title{font-family:var(--dk-font-display);font-size:20px;font-weight:700;color:var(--dk-fg);margin:0 0 6px}
.desc{font-size:14px;color:var(--dk-fg-1);line-height:1.55;margin:0 0 14px}
.cta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--dk-brand)}
</style></head>
<body class="dk-reset">
  <div class="card">
    <div class="thumb"></div>
    <div class="body">
      <div class="tags"><span class="tag">Finance</span><span class="tag">Construction</span></div>
      <h4 class="title">QueriLynx</h4>
      <p class="desc">A unified, multi-agent platform that lets users explore data from various sources using no code.</p>
      <span class="cta">Explore →</span>
    </div>
  </div>
</body></html>
