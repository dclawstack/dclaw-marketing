<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--dk-bg);font-family:var(--dk-font-sans)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{flex:1;min-width:78px;border-radius:var(--dk-radius-sm);overflow:hidden;border:1px solid var(--dk-border)}
  .chip{height:60px}
  .meta{padding:6px 8px}
  .name{font-size:11px;font-weight:600;color:var(--dk-fg);line-height:1.2}
  .hex{font-size:10px;color:var(--dk-fg-2);font-family:var(--dk-font-mono);margin-top:1px}
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:var(--dk-ink)"></div><div class="meta"><div class="name">ink</div><div class="hex">#0F0F12</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-800)"></div><div class="meta"><div class="name">gray-800</div><div class="hex">#2B2B33</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-700)"></div><div class="meta"><div class="name">gray-700</div><div class="hex">#404049</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-500)"></div><div class="meta"><div class="name">gray-500</div><div class="hex">#7A7A85</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-300)"></div><div class="meta"><div class="name">gray-300</div><div class="hex">#D6D6D6</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-200)"></div><div class="meta"><div class="name">gray-200</div><div class="hex">#E8E8EC</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-100)"></div><div class="meta"><div class="name">gray-100</div><div class="hex">#F2F2F4</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-gray-50);border-bottom:1px solid var(--dk-border)"></div><div class="meta"><div class="name">gray-50</div><div class="hex">#F8F8FA</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--dk-white);border-bottom:1px solid var(--dk-border)"></div><div class="meta"><div class="name">white</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body></html>
